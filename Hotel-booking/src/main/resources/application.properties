# ==============================
# SERVER CONFIG
# ==============================
# Prefer env var PORT if set, else default 9090
server.port=${PORT:9090}
server.servlet.context-path=/hotel-booking

# ==============================
# DATABASE (H2 by default, override via env for MySQL)
# ==============================
spring.datasource.url=${DB_URL:jdbc:h2:mem:hotel_booking}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# ==============================
# JPA / HIBERNATE
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false

# ==============================
# JWT CONFIG (Base64 ≥ 32 bytes)
# ==============================
jwt.secret=QXN3aW4tMzJieXRlcy1taW4tZGV2LXNlY3JldC0xMjM0NTY3ODkwMTIzNA==

# ==============================
# SECURITY
# ==============================
# Keep Spring Security auto-config enabled; our custom SecurityFilterChain overrides defaults

# ==============================
# LOGGING
# ==============================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.example.hotel=DEBUG
logging.level.org.springframework.security=INFO

# ==============================
# FILE UPLOADS / THEME
# ==============================
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

