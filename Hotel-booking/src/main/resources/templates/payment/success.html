<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful | Hotel Bliss</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body luxury-bg">
<div th:replace="fragments/header :: siteHeader"></div>
<div th:insert="fragments/toast :: toast"></div>

<main class="page-container page-container--narrow">
    <section class="section glass-panel confirmation-card">
        <p class="eyebrow">Payment received</p>
        <h1>Thank you!</h1>
        <p class="subtitle">Your booking is fully paid. A receipt has been recorded.</p>

        <div class="confirm-grid">
            <div>
                <h4>Booking</h4>
                <p th:text="'HB' + ${booking.id}"></p>
            </div>
            <div>
                <h4>Amount</h4>
                <p th:text="'₹' + ${#numbers.formatDecimal(payment.amount, 0, 'COMMA', 2, 'POINT')}"></p>
            </div>
            <div>
                <h4>Method</h4>
                <p th:text="${payment.method}"></p>
            </div>
            <div>
                <h4>Reference</h4>
                <p th:text="${payment.transactionRef}"></p>
            </div>
        </div>

        <div class="hero-actions">
            <a class="btn btn-primary" th:href="@{/user/bookings}">View my bookings</a>
            <a class="btn btn-outline" th:href="@{'/payments/checkout/' + ${booking.id}}">Payment details</a>
        </div>
    </section>
</main>

<div th:replace="fragments/footer :: siteFooter"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
