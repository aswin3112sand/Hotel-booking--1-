<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Failed | Hotel Bliss</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body luxury-bg">
<div th:replace="fragments/header :: siteHeader"></div>
<div th:insert="fragments/toast :: toast"></div>

<main class="page-container page-container--narrow">
    <section class="section glass-panel confirmation-card">
        <p class="eyebrow">Payment attempt failed</p>
        <h1>Let's try again</h1>
        <p class="subtitle">We couldn't confirm your payment for <span th:text="${booking.room.title}"></span>.</p>

        <div class="alert error">Your payment isn't recorded. Please retry.</div>

        <div class="confirm-grid">
            <div>
                <h4>Booking</h4>
                <p th:text="'HB' + ${booking.id}"></p>
            </div>
            <div>
                <h4>Amount</h4>
                <p th:text="'₹' + ${#numbers.formatDecimal(payment.amount, 0, 'COMMA', 2, 'POINT')}"></p>
            </div>
            <div>
                <h4>Last status</h4>
                <span class="status-chip" th:text="${payment.status}"></span>
            </div>
        </div>

        <div class="hero-actions">
            <a class="btn btn-primary" th:href="@{'/payments/checkout/' + ${booking.id}}">Retry payment</a>
            <a class="btn btn-outline" th:href="@{/user/bookings}">Back to my bookings</a>
        </div>
    </section>
</main>

<div th:replace="fragments/footer :: siteFooter"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
