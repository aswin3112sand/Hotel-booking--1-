<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings | Hotel Bliss</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body luxury-bg">
<div th:replace="fragments/header :: siteHeader"></div>

<main class="page-container">
    <section class="section glass-panel">
        <div class="panel-header">
            <div>
                <p class="eyebrow">Hello again</p>
                <h2>Your stays</h2>
            </div>
        </div>
        <div class="alert success" th:if="${msg}" th:text="${msg}"></div>
        <div class="alert error" th:if="${error}" th:text="${error}"></div>
        <div class="booking-list">
            <article class="booking-card" th:each="booking : ${bookings}">
                <div>
                    <p class="room-city" th:text="${booking.room.city}"></p>
                    <h3 th:text="${booking.room.title}"></h3>
                    <p th:text="${booking.room.roomType.label}"></p>
                </div>
                <div>
                    <h4>Dates</h4>
                    <p th:text="${#temporals.format(booking.checkIn, 'dd MMM')} + ' – ' + ${#temporals.format(booking.checkOut, 'dd MMM')}"></p>
                </div>
                <div>
                    <h4>Status</h4>
                    <span class="status-chip" th:text="${booking.status}"></span>
                </div>
                <div>
                    <form class="button-row" th:if="${booking.status.name() != 'CANCELLED'}" th:action="@{'/user/bookings/' + ${booking.id} + '/cancel'}" method="post">
                        <button class="btn btn-outline" type="submit">Cancel</button>
                    </form>
                </div>
            </article>
            <p class="muted" th:if="${bookings.empty}">No bookings yet. Discover your next stay.</p>
        </div>
    </section>
</main>

<div th:replace="fragments/footer :: siteFooter"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
