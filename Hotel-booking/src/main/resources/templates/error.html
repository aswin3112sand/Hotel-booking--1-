<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | Hotel Bliss</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body luxury-bg">
<div th:replace="fragments/header :: siteHeader"></div>
<main class="page-container page-container--narrow">
    <section class="section glass-panel confirmation-card">
        <p class="eyebrow" th:text="${status}"></p>
        <h1 th:text="${error}">Error</h1>
        <p class="subtitle" th:text="${message}"></p>
        <a class="btn btn-primary" th:href="@{/}">Back to home</a>
    </section>
</main>
<div th:replace="fragments/footer :: siteFooter"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
