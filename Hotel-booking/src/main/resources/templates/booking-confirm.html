<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed | Hotel Bliss</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body luxury-bg">
<div th:replace="fragments/header :: siteHeader"></div>
<div th:insert="fragments/toast :: toast"></div>

<main class="page-container page-container--narrow">
    <section class="section glass-panel confirmation-card">
        <p class="eyebrow">Reservation confirmed</p>
        <h1>Welcome aboard</h1>
        <p class="subtitle">Your stay at <span th:text="${booking.room.title}"></span> is secured.</p>
        <div class="confirm-grid">
            <div>
                <h4>Stay</h4>
                <p th:text="${#temporals.format(booking.checkIn, 'dd MMM yyyy')} + ' → ' + ${#temporals.format(booking.checkOut, 'dd MMM yyyy')}"></p>
            </div>
            <div>
                <h4>Guests</h4>
                <p th:text="${booking.guests}"></p>
            </div>
            <div>
                <h4>Total</h4>
                <p th:text="'₹' + ${#numbers.formatDecimal(booking.totalPrice, 0, 'COMMA', 2, 'POINT')}"></p>
            </div>
            <div>
                <h4>Booking ID</h4>
                <p th:text="'HB' + ${booking.id}"></p>
            </div>
        </div>
        <div class="hero-actions">
            <a class="btn btn-primary" th:href="@{/user/bookings}">View my bookings</a>
            <a class="btn btn-outline" th:href="@{/rooms}">Explore more rooms</a>
        </div>
    </section>
</main>

<div th:replace="fragments/footer :: siteFooter"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
