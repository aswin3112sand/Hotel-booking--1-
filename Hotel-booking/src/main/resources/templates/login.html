<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Hotel Bliss</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body luxury-bg auth-bg">
<main class="page-container page-container--narrow">
    <section class="section auth-card glass-panel">
        <h1>Welcome back</h1>
        <p class="muted">Sign in to continue booking your luxury stay.</p>

        <div class="alert error" th:if="${error}" th:text="${error}"></div>
        <div class="alert success" th:if="${msg}" th:text="${msg}"></div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" name="next" th:value="${next}">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="********" required>
            </div>
            <div class="button-row">
                <button type="submit" class="btn btn-primary">Login</button>
            </div>
        </form>
        <p class="muted">New here? <a th:href="@{/register}" class="create-account-link">Create an account</a></p>
    </section>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
