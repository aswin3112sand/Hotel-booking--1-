<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Rooms | Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body luxury-bg">
<div th:replace="fragments/header :: siteHeader"></div>

<main class="page-container page-container--wide">
    <section class="section glass-panel">
        <div class="panel-header">
            <div>
                <p class="eyebrow">Room inventory</p>
                <h2>Manage rooms</h2>
            </div>
            <a class="btn btn-primary" th:href="@{/admin/rooms/new}">Add room</a>
        </div>
        <div class="alert success" th:if="${msg}" th:text="${msg}"></div>
        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <table class="data-table">
            <thead>
            <tr>
                <th>Title</th>
                <th>Type</th>
                <th>City</th>
                <th>Price</th>
                <th>Status</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="room : ${rooms}">
                <td th:text="${room.title}"></td>
                <td th:text="${room.roomType.label}"></td>
                <td th:text="${room.city}"></td>
                <td th:text="'₹' + ${room.price}"></td>
                <td>
                    <span class="status-chip" th:text="${room.available ? 'Available' : 'Offline'}"></span>
                </td>
                <td class="table-actions">
                    <a th:href="@{'/admin/rooms/' + ${room.id} + '/edit'}">Edit</a>
                    <form th:action="@{'/admin/rooms/' + ${room.id} + '/delete'}" method="post">
                        <button type="submit" class="link danger">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>

<div th:replace="fragments/footer :: siteFooter"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
