<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Hotel Bliss</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-body luxury-bg auth-bg">
<main class="page-container page-container--narrow">
    <section class="section auth-card glass-panel">
        <h1>Create account</h1>
        <p class="muted">Stay updated with curated suites.</p>

        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/register}" th:object="${user}" method="post">
            <input type="hidden" name="next" th:value="${next}">

            <div class="form-group">
                <label>Name</label>
                <input type="text" th:field="*{name}" placeholder="Full name">
                <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email}" placeholder="your@email.com">
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" th:field="*{password}" placeholder="********">
                <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div class="form-group">
                <label>Confirm password</label>
                <input type="password" th:field="*{confirmPassword}" placeholder="********">
                <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>

            <div class="button-row">
                <button type="submit" class="btn btn-primary">Register</button>
            </div>
        </form>

        <p class="muted">Already have an account? <a th:href="@{/login}">Login</a></p>
    </section>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
